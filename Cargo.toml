[package]
name = "jscope"
version = "0.1.0"
edition = "2024"
description = "Find which systemd service just got noisy in a live journal dashboard"
license = "MIT OR Apache-2.0"
homepage = "https://16384.dev/journalscope"
repository = "https://git.16384.dev/journalscope.git"
readme = "README.md"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
rustix = { version = "1", features = ["event", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
time = { version = "0.3", features = ["local-offset"] }
unicode-width = "0.2"

[dev-dependencies]
hegeltest = "=0.52.7"
