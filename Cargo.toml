[package]
name = "jscope"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
rustix = { version = "1", features = ["event", "fs"] }
serde_json = "1"
signal-hook = "0.3"
time = { version = "0.3", features = ["local-offset"] }
unicode-width = "0.2"

[dev-dependencies]
hegeltest = "=0.52.7"
